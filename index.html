<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>迷你交通大亨</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div class="title-row">
        <div class="title">迷你交通大亨 <span>原型 0.5</span></div>
        <span class="mini-money" id="miniMoney">$0</span>
        <button id="collapse" class="icon" title="收合面板 (H)" aria-label="收合面板" aria-expanded="true">▾</button>
      </div>
      <div class="panel-body">
      <div class="stats">
        <div class="money" id="money">$0</div>
        <div class="stat"><span>車上乘客</span><b id="riders">0 / 0</b></div>
        <div class="stat"><span>已載送</span><b id="delivered">0</b></div>
        <div class="stat"><span>居民</span><b id="residents">0</b></div>
      </div>
      <div class="status" id="status"></div>
      <div id="types" class="row seg"></div>
      <div class="row">
        <button id="toggle" class="primary">⏸ 暫停</button>
        <button id="camera">🎥 跟隨火車</button>
      </div>
      <label class="row slider">
        <span>速度</span>
        <input id="speed" type="range" min="0" max="12" step="0.1" value="4" />
        <output id="speedOut">4.0</output>
      </label>
      <div class="row">
        <button id="addCar">＋ 車廂</button>
        <button id="removeCar">－ 車廂</button>
        <span id="carCount" class="muted"></span>
      </div>
      <button id="reset" class="ghost">重新開始</button>
      <div class="hint">拖曳旋轉・滾輪縮放・右鍵平移・H 收合面板・Esc 結束工具</div>
      </div>
    </div>
    <div id="build">
      <div id="buildCard" hidden>
        <div id="bcTitle"></div>
        <div id="bcInfo"></div>
        <div id="bcActions"></div>
      </div>
      <div id="tools">
        <button data-tool="track"><i>🛤️</i>鐵路</button>
        <button data-tool="station"><i>🚉</i>車站</button>
        <button data-tool="demolish"><i>🚧</i>拆除</button>
        <button id="quick"><i>✨</i>範例路線</button>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
